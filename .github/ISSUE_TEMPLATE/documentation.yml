name: "📖 Documentation & Localization"
description: "Suggest improvements, report errors, or contribute translations for Chromatik docs"
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📖 Documentation & Localization
        Accurate, thorough documentation and clear translations are essential for creators and developers alike.

  - type: dropdown
    id: doc-area
    attributes:
      label: Documentation Area
      options:
        - "English README (README.md)"
        - "Turkish README (README.tr.md)"
        - "Audio & DSP Architecture Documentation"
        - "Developer Setup & Docker Environment"
        - "Frontend / Vuetify Guidelines"
        - "Backend API Endpoints"
        - "In-App UI Translations (i18n)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: issue-description
    attributes:
      label: Description of Issue or Gap
      description: What is inaccurate, outdated, or missing from the current documentation?
      placeholder: "The section on Automix S-Curve does not explain how the 280Hz low-shelf filter behaves when..."
    validations:
      required: true

  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed Content or Correction
      description: Provide the suggested wording, revised code snippets, or draft documentation.
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am willing to submit a Pull Request to fix or add this documentation.
          required: false
