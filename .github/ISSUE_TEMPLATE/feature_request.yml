name: "💡 Feature Request"
description: "Suggest a new feature, DSP capability, or UX enhancement for Chromatik"
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 Feature Request
        Have an idea to make Chromatik a better beat marketplace, workstation, or producer ecosystem? Tell us about it!

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What part of the application does this feature request focus on?
      options:
        - "Audio Engine & DSP (Pitch, Tempo, Limiter, Automix, Effects)"
        - "Player & Visualizers (Waveform, Spectrum, CDJ Controls)"
        - "Beat Marketplace & Licensing Flow"
        - "Producer / Artist Profile & Social Features"
        - "UI / UX & Theme (Vuetify, Glassmorphism, Responsiveness)"
        - "Backend & API / Performance"
        - "DevOps & Deployment (Docker, CI/CD)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or workflow friction?
      placeholder: "I find it difficult to audition a beat at multiple keys while singing along because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature Description
      description: Clear and concise description of what you want to happen and how you envision it working.
      placeholder: "Add a vocal rehearsal pitch lock toggle that automatically..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions, third-party tools, or workarounds you've explored.
      placeholder: "Exporting the audio to a desktop DAW or using external pitch vst..."
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups, UI References, or Examples
      description: Drag & drop UI wireframes, Figma screenshots, or links to similar implementations in other DAWs/platforms.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing feature requests to ensure this is not a duplicate.
          required: true
        - label: This idea aligns with Chromatik's vision as an interactive studio-grade producer ecosystem.
          required: false
